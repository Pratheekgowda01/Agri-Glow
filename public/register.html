<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Agri Glow</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #4CAF50, #45a049);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo i {
            font-size: 2.5rem;
            color: #4CAF50;
            margin-bottom: 0.5rem;
            display: block;
        }

        .logo h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.3rem;
        }

        .logo p {
            color: #666;
            font-size: 0.9rem;
        }

        .role-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: #f5f5f5;
            padding: 5px;
            border-radius: 50px;
        }

        .role-option {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: #666;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .role-option.active {
            background: #4CAF50;
            color: white;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.3);
        }

        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            padding-left: 45px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .form-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1rem;
            margin-top: 10px;
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }

        .strength-bar {
            height: 3px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.3rem;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .strength-weak { background: #f44336; }
        .strength-medium { background: #ff9800; }
        .strength-strong { background: #4CAF50; }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            margin-top: 1rem;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        .links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .links a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .back-home:hover {
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .back-home {
                position: relative;
                display: block;
                text-align: center;
                margin-bottom: 20px;
                color: #4CAF50;
            }

            .form-row {
                flex-direction: column;
            }

            .register-container {
                padding: 2rem 1.5rem;
                margin: 10px;
            }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 0.5rem;
            padding: 0;
        }

        .location-info {
            background: #e8f5e8;
            padding: 0.8rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #2e7d32;
        }

        .demo-note {
            background: #fff3e0;
            border: 1px solid #ffcc02;
            padding: 0.8rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            color: #e65100;
        }

        .map-wrapper {
            margin-top: 1.5rem;
        }

        .map-label {
            display: block;
            font-weight: 600;
            color: #333;
        }

        #locationMap {
            width: 100%;
            height: 260px;
            border-radius: 15px;
            margin-top: 0.8rem;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        .coordinates-row {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .form-group.compact input {
            padding-left: 15px;
        }

        .form-group.compact i {
            display: none;
        }

        @media (max-width: 768px) {
            .coordinates-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="register-container">
        <div class="logo">
            <i class="fas fa-leaf"></i>
            <h1>Join Agri Glow</h1>
            <p>Create your account and start connecting</p>
        </div>

        <!-- Demo note removed for production -->

        <div class="role-selector">
            <button type="button" class="role-option active" data-role="buyer">
                <i class="fas fa-shopping-cart"></i> Buyer
            </button>
            <button type="button" class="role-option" data-role="farmer">
                <i class="fas fa-seedling"></i> Farmer
            </button>
        </div>

        <div class="alert" id="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
                <i class="fas fa-user"></i>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g., +919876543210" required>
                    <i class="fas fa-phone"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <i class="fas fa-lock"></i>
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span id="strengthText">Password strength</span>
                </div>
            </div>

            <div class="form-group">
                <label for="profileImage">Profile Picture</label>
                <input type="file" id="profileImage" name="profileImage" accept="image/*">
                <i class="fas fa-image"></i>
            </div>

            <div class="location-info">
                <i class="fas fa-map-marker-alt"></i>
                <strong>Location Information:</strong>
                This helps buyers find nearby farmers and enables delivery tracking.
            </div>

            <div class="map-wrapper">
                <span class="map-label">Select Location</span>
                <div id="locationMap"></div>
                <div class="coordinates-row">
                    <div class="form-group compact">
                        <label for="latitude">Latitude</label>
                        <input type="text" id="latitude" name="latitude" placeholder="Click map to set" readonly>
                    </div>
                    <div class="form-group compact">
                        <label for="longitude">Longitude</label>
                        <input type="text" id="longitude" name="longitude" placeholder="Click map to set" readonly>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Street address" required>
                <i class="fas fa-home"></i>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" required>
                    <i class="fas fa-city"></i>
                </div>
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" required>
                    <i class="fas fa-map"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="pincode">Pincode</label>
                <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
                <i class="fas fa-mail-bulk"></i>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="/terms.html" style="color: #4CAF50;" target="_blank">Terms of Service</a> and <a href="/privacy.html" style="color: #4CAF50;" target="_blank">Privacy Policy</a></label>
            </div>

            <button type="submit" class="btn" id="registerBtn">
                <i class="fas fa-user-plus"></i>
                Create Account
            </button>
        </form>

        <div class="links">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // DOM elements
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const alert = document.getElementById('alert');
        const roleOptions = document.querySelectorAll('.role-option');
        const passwordInput = document.getElementById('password');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const latitudeInput = document.getElementById('latitude');
        const longitudeInput = document.getElementById('longitude');

        const defaultLocation = [28.6139, 77.2090];
        const fallbackTileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        let map;
        let marker;
        let selectedRole = 'buyer';
        let mapConfig = {
            osmTileUrl: fallbackTileUrl,
            nominatimUrl: 'https://nominatim.openstreetmap.org',
            osrmRouteUrl: 'https://router.project-osrm.org'
        };

        async function loadMapConfig() {
            try {
                const response = await fetch('/config/maps');
                if (response.ok) {
                    const data = await response.json();
                    mapConfig = {
                        osmTileUrl: data.osmTileUrl || fallbackTileUrl,
                        nominatimUrl: data.nominatimUrl || mapConfig.nominatimUrl,
                        osrmRouteUrl: data.osrmRouteUrl || mapConfig.osrmRouteUrl
                    };
                }
            } catch (error) {
                console.warn('Map config load failed, using defaults', error);
            }
        }

        function initMap() {
            map = L.map('locationMap').setView(defaultLocation, 5);
            L.tileLayer(mapConfig.osmTileUrl, {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
            marker = L.marker(defaultLocation, { draggable: true }).addTo(map);
            marker.on('dragend', () => updateLatLng(marker.getLatLng()));
            map.on('click', event => {
                marker.setLatLng(event.latlng);
                updateLatLng(event.latlng);
            });
            updateLatLng({ lat: defaultLocation[0], lng: defaultLocation[1] });
        }

        function updateLatLng(latlng) {
            latitudeInput.value = latlng.lat.toFixed(6);
            longitudeInput.value = latlng.lng.toFixed(6);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadMapConfig();
            initMap();
        });

        // Role selection handler
        roleOptions.forEach(option => {
            option.addEventListener('click', () => {
                roleOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                selectedRole = option.dataset.role;
                
                // Update form based on role
                updateFormForRole(selectedRole);
            });
        });

        // Update form based on role
        function updateFormForRole(role) {
            const locationInfo = document.querySelector('.location-info');
            if (role === 'farmer') {
                locationInfo.innerHTML = `
                    <i class="fas fa-tractor"></i>
                    <strong>Farm Location:</strong>
                    This helps buyers find your farm and calculate delivery distances.
                `;
            } else {
                locationInfo.innerHTML = `
                    <i class="fas fa-map-marker-alt"></i>
                    <strong>Delivery Address:</strong>
                    This helps farmers calculate delivery costs and find nearby products.
                `;
            }
        }

        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            let feedback = [];

            if (password.length >= 8) strength++;
            else feedback.push('At least 8 characters');

            if (/[a-z]/.test(password)) strength++;
            else feedback.push('lowercase letter');

            if (/[A-Z]/.test(password)) strength++;
            else feedback.push('uppercase letter');

            if (/[0-9]/.test(password)) strength++;
            else feedback.push('number');

            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            else feedback.push('special character');

            return { strength, feedback };
        }

        // Update password strength indicator
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            const { strength, feedback } = checkPasswordStrength(password);

            const percentage = (strength / 5) * 100;
            strengthFill.style.width = percentage + '%';

            if (strength <= 2) {
                strengthFill.className = 'strength-fill strength-weak';
                strengthText.textContent = 'Weak password';
            } else if (strength <= 3) {
                strengthFill.className = 'strength-fill strength-medium';
                strengthText.textContent = 'Medium password';
            } else {
                strengthFill.className = 'strength-fill strength-strong';
                strengthText.textContent = 'Strong password';
            }
        });

        // Show alert function
        function showAlert(message, type = 'error') {
            alert.className = `alert ${type} show`;
            alert.textContent = message;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Form validation
        function validateForm(formData) {
            const errors = [];

            if (formData.name.length < 2) {
                errors.push('Name must be at least 2 characters');
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
                errors.push('Please enter a valid email address');
            }

            if (!/^[\+]?[1-9][\d]{0,15}$/.test(formData.phone)) {
                errors.push('Please enter a valid phone number');
            }

            if (formData.password.length < 6) {
                errors.push('Password must be at least 6 characters');
            }

            if (!/^[0-9]{6}$/.test(formData.pincode)) {
                errors.push('Please enter a valid 6-digit pincode');
            }

            if (!formData.latitude || !formData.longitude) {
                errors.push('Please select your location on the map');
            }

            return errors;
        }

        // Register form handler
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                password: document.getElementById('password').value,
                address: document.getElementById('address').value.trim(),
                city: document.getElementById('city').value.trim(),
                state: document.getElementById('state').value.trim(),
                pincode: document.getElementById('pincode').value.trim(),
                role: selectedRole,
                latitude: latitudeInput.value,
                longitude: longitudeInput.value
            };

            // Validate form
            const errors = validateForm(formData);
            if (errors.length > 0) {
                showAlert(errors[0]);
                return;
            }

            if (!document.getElementById('terms').checked) {
                showAlert('Please accept the terms and conditions');
                return;
            }

            // Loading state
            registerBtn.disabled = true;
            registerBtn.classList.add('loading');
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

            try {
                // Use FormData for file upload
                const fd = new FormData();
                Object.entries(formData).forEach(([key, value]) => fd.append(key, value));
                const profileImageInput = document.getElementById('profileImage');
                if (profileImageInput.files.length > 0) {
                    fd.append('profileImage', profileImageInput.files[0]);
                }
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    body: fd
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Account created successfully! Redirecting to dashboard...', 'success');
                    
                    // Store token and user info
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = selectedRole === 'farmer' ? '/farmer-dashboard.html' : '/buyer-dashboard.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Registration failed');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('Network error. Please try again.');
            } finally {
                // Reset button state
                registerBtn.disabled = false;
                registerBtn.classList.remove('loading');
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });

        // URL parameter handling for role pre-selection
        const urlParams = new URLSearchParams(window.location.search);
        const roleParam = urlParams.get('role');
        if (roleParam && ['farmer', 'buyer'].includes(roleParam)) {
            selectedRole = roleParam;
            roleOptions.forEach(opt => {
                opt.classList.toggle('active', opt.dataset.role === roleParam);
            });
            updateFormForRole(roleParam);
        }

        // Phone number formatting
        document.getElementById('phone').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.startsWith('91') && value.length > 2) {
                e.target.value = '+' + value;
            } else if (!value.startsWith('+') && value.length === 10) {
                e.target.value = '+91' + value;
            }
        });

        // Pincode validation
        document.getElementById('pincode').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        });

        console.log('🌱 Agri Glow Registration Page Ready!');
    </script>
</body>
</html>
