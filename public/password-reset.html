<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Agri Glow</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #00e676 0%, #00c853 50%, #009688 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,255,136,0.3) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            filter: blur(80px);
            animation: glow 6s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.2); opacity: 0.6; }
        }

        .reset-container {
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0, 200, 150, 0.4);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .reset-container:hover {
            transform: translateY(-4px);
        }

        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .reset-header h1 {
            color: #009688;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }

        .reset-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group { 
            margin-bottom: 1.5rem; 
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            font-family: "Poppins", sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00c853;
            box-shadow: 0 0 10px rgba(0, 200, 83, 0.2);
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00e676 0%, #00c853 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 200, 83, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #00c853;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #009688;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 0.5rem;
        }

        .step {
            flex: 1;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            position: relative;
        }

        .step.active {
            background: #00c853;
        }

        .loading {
            display: none;
            text-align: center;
            color: #00c853;
        }

        .spinner {
            border: 3px solid #e0e0e0;
            border-top: 3px solid #00c853;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <h1>🔐 Reset Password</h1>
            <p>Enter your email and follow the steps to reset your password</p>
        </div>

        <div id="alertContainer"></div>

        <form id="resetForm">
            <!-- Step 1: Email -->
            <div id="step1" class="reset-step">
                <div class="steps">
                    <div class="step active" id="step1Indicator"></div>
                    <div class="step" id="step2Indicator"></div>
                    <div class="step" id="step3Indicator"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="your.email@example.com" 
                        required
                    >
                </div>

                <button type="button" class="submit-btn" onclick="sendResetEmail()">
                    Send Reset Link
                </button>
            </div>

            <!-- Step 2: OTP Verification -->
            <div id="step2" class="reset-step" style="display: none;">
                <div class="steps">
                    <div class="step active"></div>
                    <div class="step active" id="step2Indicator"></div>
                    <div class="step" id="step3Indicator"></div>
                </div>

                <p style="color: #666; margin-bottom: 1.5rem; text-align: center;">
                    We've sent a verification code to your email. Enter it below.
                </p>

                <div class="form-group">
                    <label for="otp">Verification Code</label>
                    <input 
                        type="text" 
                        id="otp" 
                        name="otp" 
                        placeholder="123456" 
                        maxlength="6"
                    >
                </div>

                <button type="button" class="submit-btn" onclick="verifyOTP()">
                    Verify Code
                </button>

                <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #666;">
                    <button type="button" style="background: none; border: none; color: #00c853; cursor: pointer; text-decoration: underline;" onclick="resendOTP()">
                        Resend Code
                    </button>
                </p>
            </div>

            <!-- Step 3: New Password -->
            <div id="step3" class="reset-step" style="display: none;">
                <div class="steps">
                    <div class="step active"></div>
                    <div class="step active"></div>
                    <div class="step active" id="step3Indicator"></div>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        name="newPassword" 
                        placeholder="Enter new password" 
                        required
                        minlength="6"
                    >
                    <small style="color: #666;">Minimum 6 characters</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm password" 
                        required
                    >
                </div>

                <button type="button" class="submit-btn" onclick="resetPassword()">
                    Reset Password
                </button>
            </div>
        </form>

        <div class="back-link">
            <a href="/login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        let resetEmail = '';
        let resetOTP = '';
        let resetToken = '';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
            
            if (type === 'success') {
                setTimeout(() => alert.style.display = 'none', 3000);
            }
        }

        async function sendResetEmail() {
            const email = document.getElementById('email').value;
            
            if (!email) {
                showAlert('Please enter your email address', 'error');
                return;
            }

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert(data.message || 'Error sending reset email', 'error');
                    return;
                }

                resetEmail = email;
                showAlert('Verification code sent to your email', 'success');
                
                // Move to step 2
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            } catch (error) {
                showAlert('Failed to send reset email: ' + error.message, 'error');
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('otp').value;
            
            if (!otp) {
                showAlert('Please enter the verification code', 'error');
                return;
            }

            try {
                const response = await fetch('/api/auth/verify-reset-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: resetEmail, otp })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert(data.message || 'Invalid verification code', 'error');
                    return;
                }

                resetToken = data.token;
                showAlert('Code verified successfully', 'success');
                
                // Move to step 3
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
            } catch (error) {
                showAlert('Verification failed: ' + error.message, 'error');
            }
        }

        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword) {
                showAlert('Please enter a new password', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: resetEmail,
                        token: resetToken,
                        newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert(data.message || 'Error resetting password', 'error');
                    return;
                }

                showAlert('Password reset successful! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (error) {
                showAlert('Password reset failed: ' + error.message, 'error');
            }
        }

        async function resendOTP() {
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: resetEmail })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('New code sent to your email', 'success');
                } else {
                    showAlert(data.message || 'Error sending code', 'error');
                }
            } catch (error) {
                showAlert('Failed to resend code: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
